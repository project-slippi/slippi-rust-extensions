[package]
name = "slippi-matchmaking"
description = "Matchmaking client that talks to the Slippi matchmaking service over WebSocket."
version = "0.1.0"
authors = ["Slippi Team"]
edition = "2024"
publish = false

[features]
default = []
ishiiruka = []
mainline = []
playback = []

[dependencies]
dolphin-integrations = { path = "../dolphin" }
slippi-user = { path = "../user" }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Shares rustls and webpki-roots with ureq so no second TLS stack is linked.
tungstenite = { version = "0.27", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }

[dev-dependencies]
slippi-gg-api = { path = "../slippi-gg-api" }
